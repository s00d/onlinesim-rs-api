name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --features "async,blocking,mock" -- -D warnings
      - name: test (published mock)
        run: cargo test --features "async,blocking,mock"
      - name: test async without mock (unit only)
        run: cargo test --no-default-features --features async --test error_and_types
      - name: publish dry-run
        run: cargo publish --dry-run --allow-dirty
