[package]
name = "onlinesim-rs-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust client for OnlineSim SMS API"
license = "Apache-2.0"
authors = ["s00d"]
repository = "https://github.com/s00d/onlinesim-rs-api"
homepage = "https://github.com/s00d/onlinesim-rs-api"
documentation = "https://docs.rs/onlinesim-rs-api"
readme = "README.md"
keywords = ["onlinesim", "sms", "api", "client"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "LICENSE",
    "README.md",
    "Cargo.toml",
]

[features]
default = ["async"]
async = ["dep:tokio", "reqwest/json"]
blocking = ["reqwest/blocking", "reqwest/json"]
# Built-in HTTP mock server for tests / local integration (implies async).
mock = ["async", "dep:wiremock"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"], optional = true }
wiremock = { version = "0.6", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"

[[test]]
name = "api_mock"
required-features = ["mock"]

[[example]]
name = "get_balance"
required-features = ["async"]

[[example]]
name = "wait_sms"
required-features = ["async"]

[[example]]
name = "mock_sms_flow"
required-features = ["mock"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
