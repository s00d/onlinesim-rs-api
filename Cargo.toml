[package]
name = "onlinesim-rs-api"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Typed async and blocking Rust client for the OnlineSim SMS API"
license = "Apache-2.0"
authors = ["s00d"]
repository = "https://github.com/s00d/onlinesim-rs-api"
documentation = "https://docs.rs/onlinesim-rs-api"
readme = "README.md"
keywords = ["onlinesim", "sms", "api", "client"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
# Anchored with "/": unanchored patterns match at any depth (docs/node_modules/**/README.md).
include = ["/src/**/*", "/LICENSE", "/README.md", "/CHANGELOG.md", "/Cargo.toml"]

[features]
default = ["async"]
# Async `Client` (reqwest + tokio).
async = ["dep:reqwest", "dep:tokio"]
# Blocking `blocking::Client`.
blocking = ["dep:reqwest", "reqwest/blocking"]
# `mock::MockOnlineSim`: an in-process fake OnlineSim API (a `Transport` / `BlockingTransport`) for your own
# tests. No extra dependencies; needs `async` or `blocking` for a client.
mock-transport = []
# `mock-transport` plus `MockOnlineSim::start()`, the same fake served over local HTTP (wiremock; implies `async`).
mock = ["async", "mock-transport", "dep:wiremock"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"], optional = true }
# 0.6.5 uses let chains (Rust 1.88) without declaring a rust-version.
wiremock = { version = ">=0.6, <0.6.5", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[[test]]
name = "client"
required-features = ["async"]

[[test]]
name = "numbers"
required-features = ["async"]

[[test]]
name = "rent"
required-features = ["async"]

[[test]]
name = "user"
required-features = ["async"]

[[test]]
name = "free"
required-features = ["async"]

[[test]]
name = "wait"
required-features = ["async"]

[[test]]
name = "integration"
required-features = ["async"]

[[test]]
name = "mock"
required-features = ["mock-transport", "async", "blocking"]

[[test]]
name = "mock_server"
required-features = ["mock", "blocking"]

[[test]]
name = "blocking"
required-features = ["blocking"]

[[example]]
name = "receive_sms"
required-features = ["async"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
